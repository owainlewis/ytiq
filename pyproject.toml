[project]
name = "ytiq"
version = "0.1.0"
description = "Track your YouTube niche: creator feed, outliers, and a swipe file."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ytiq = "ytiq.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
